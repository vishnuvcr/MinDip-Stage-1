name: Phase 9 — Broker Model Reconciliation

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/phase9_broker_model_reconciliation.py"
      - "docs/PHASE9_BROKER_MODEL.md"
      - ".github/workflows/phase9-broker-model.yml"

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install pandas numpy scipy openpyxl
      - name: Calibrate Black-76 model
        run: |
          python scripts/phase9_broker_model_reconciliation.py \
            --output data/cache/phase9
      - name: Verify calibration
        run: |
          cat data/cache/phase9/broker_model_reconciliation.json
          python - <<'PY'
          import json
          p=json.load(open("data/cache/phase9/broker_model_reconciliation.json"))
          assert p["intrinsic_abs_error"] < 10
          assert p["delta_abs_error"] < 0.01
          assert p["vega_abs_error"] < 0.02
          assert p["pop_abs_error"] < 0.03
          PY
      - name: Commit Phase 9 outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cache/phase9/*.csv data/cache/phase9/*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "phase-9: cache broker model reconciliation"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push --force-with-lease
