name: Phase 5 — CPCV and Statistical Validation

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/phase5_cpcv_validation.py"
      - "docs/PHASE5_RESULTS.md"
      - ".github/workflows/phase5-cpcv-validation.yml"
      - "data/cache/phase4/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run CPCV-style stability diagnostics
        env:
          PYTHONPATH: .
        run: python scripts/phase5_cpcv_validation.py --output data/cache/phase5
      - name: Print validation summary
        run: |
          cat data/cache/phase5/cpcv_summary.csv
          echo "---- PSR ----"
          cat data/cache/phase5/psr_single_trial_diagnostic.csv
          echo "---- PBO status ----"
          cat data/cache/phase5/pbo_status.csv
      - name: Commit validation outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cache/phase5
          if git diff --cached --quiet; then
            echo "No Phase 5 changes."
            exit 0
          fi
          git commit -m "phase-5: cache CPCV stability diagnostics"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push
