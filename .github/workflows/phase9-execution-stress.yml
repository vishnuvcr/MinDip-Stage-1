name: Phase 9 — Execution Cost Stress

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/phase9_execution_cost_stress.py"
      - "docs/PHASE9_BROKER_MODEL.md"
      - ".github/workflows/phase9-execution-stress.yml"
      - "data/cache/phase8/**"

jobs:
  stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install pandas numpy
      - name: Run execution-cost stress
        run: python scripts/phase9_execution_cost_stress.py --output data/cache/phase9_execution
      - name: Print outputs
        run: |
          cat data/cache/phase9_execution/break_even_slippage.csv
          cat data/cache/phase9_execution/paytm_fee_assumption.csv
          echo "---- current brokerage-only stress ----"
          python - <<'PY'
          import pandas as pd
          x=pd.read_csv("data/cache/phase9_execution/execution_cost_stress.csv")
          print(x[x.fixed_cost_name.eq("paytm_brokerage_only_current")].to_string(index=False))
          PY
      - name: Commit Phase 9 execution stress
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cache/phase9_execution
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "phase-9: cache execution cost stress"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push --force-with-lease
