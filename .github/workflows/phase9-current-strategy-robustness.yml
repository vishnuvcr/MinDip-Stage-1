name: Phase 9 — Current Strategy Robustness

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/phase9_current_strategy_robustness.py"
      - "data/cache/phase8/**"
      - ".github/workflows/phase9-current-strategy-robustness.yml"

jobs:
  robustness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install pandas numpy
      - name: Run corrected-strategy robustness
        run: python scripts/phase9_current_strategy_robustness.py --output data/cache/phase9_current_robustness --bootstrap 10000
      - name: Print results
        run: |
          cat data/cache/phase9_current_robustness/primary_robustness_summary.csv
          cat data/cache/phase9_current_robustness/untouched_last_block.csv
      - name: Commit robustness outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cache/phase9_current_robustness
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "phase-9: cache corrected strategy robustness"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push --force-with-lease
