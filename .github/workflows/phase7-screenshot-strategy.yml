name: Phase 7 — Screenshot-Exact Strategy Re-test

on:
  workflow_dispatch:
    inputs:
      start:
        description: Sample start
        required: false
        default: "2025-10-01"
        type: string
      end:
        description: Sample end
        required: false
        default: "2026-05-27"
        type: string
  push:
    paths:
      - "scripts/phase7_screenshot_strategy.py"
      - "docs/PHASE7_SCREENSHOT_STRATEGY.md"
      - ".github/workflows/phase7-screenshot-strategy.yml"
      - "data/calendar/exchange_holidays.csv"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install pandas duckdb numpy
      - name: Run screenshot-exact backtest
        env:
          START: ${{ inputs.start || '2025-10-01' }}
          END: ${{ inputs.end || '2026-05-27' }}
        run: |
          python scripts/phase7_screenshot_strategy.py             --start "$START"             --end "$END"             --output data/cache/phase7
      - name: Verify screenshot strike mapping
        run: cat data/cache/phase7/screenshot_strike_demo.json
      - name: Show results
        run: cat data/cache/phase7/cross_index_metrics.csv
      - name: Commit Phase 7 cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cache/phase7
          if git diff --cached --quiet; then
            echo "No Phase 7 cache changes."
            exit 0
          fi
          git commit -m "phase-7: cache screenshot-exact strategy retest"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push --force-with-lease
