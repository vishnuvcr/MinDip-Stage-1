name: Phase 5 — CPCV, DSR and PBO Diagnostics

on:
  workflow_dispatch:
    inputs:
      permutations:
        description: Sign-flip permutation repetitions
        required: false
        default: "100000"
        type: string
  push:
    paths:
      - "scripts/phase5_cpcv_dsr_pbo.py"
      - "docs/PHASE5_RESULTS.md"
      - ".github/workflows/phase5-cpcv-dsr-pbo.yml"
      - "data/cache/phase3/**"
      - "data/cache/phase4/**"

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Phase 5 diagnostics
        env:
          PERMUTATIONS: ${{ inputs.permutations || '100000' }}
        run: |
          python scripts/phase5_cpcv_dsr_pbo.py             --output data/cache/phase5             --permutations "$PERMUTATIONS"
      - name: Print Phase 5 outputs
        run: |
          cat data/cache/phase5/cpcv_stability_summary.csv
          cat data/cache/phase5/untouched_last_block_holdout.csv
          cat data/cache/phase5/dsr_assessment.csv
          cat data/cache/phase5/pbo_assessment.csv
          cat data/cache/phase5/sign_flip_permutation.csv
      - name: Commit Phase 5 outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cache/phase5
          if git diff --cached --quiet; then
            echo "No Phase 5 changes."
            exit 0
          fi
          git commit -m "phase-5: cache CPCV DSR PBO diagnostics"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push
